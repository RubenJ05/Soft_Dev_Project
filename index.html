<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <main class="app">
        <h1>To-Do List</h1>

        <form id="task-form" novalidate>
            <label class="sr-only" for="task-input">Task description</label>
            <input id="task-input" type="text" placeholder="Enter a task description" maxlength="200"
                aria-label="Task description" />
            <button id="add-button" type="submit">Add</button>
        </form>

        <p id="error-message" class="error-message" aria-live="polite" hidden></p>

        <ul id="task-list" class="task-list" aria-live="polite"></ul>
        <p id="empty-message" class="empty-state">No tasks yet. Add one above.</p>
    </main>

    <script src="app.js"></script>
</body>

</html>
